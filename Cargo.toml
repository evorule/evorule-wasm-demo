[package]
name = "evorule-wasm-demo"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Minimal WASM demo: load rules -> execute command -> verify BLAKE3 audit chain (determinism spike)"

# cdylib -> .wasm for Node.js; rlib -> lets native example link run_core()
[lib]
crate-type = ["cdylib", "rlib"]

# 内核依赖：git 锁定 tag。constitution/core_eval.json 内嵌副本与该 pin
# 同版同步（见 constitution/README 与 build.rs 的 pin 解析）。本地开发
# 可临时加 [patch] 指向同级内核检出（不提交，见 README「本地开发」节）
[dependencies]
evorule-governance = { git = "https://gitee.com/evorule/evorule.git", tag = "v0.8.5" }
evorule-reactor = { git = "https://gitee.com/evorule/evorule.git", tag = "v0.8.5" }
evorule-tcb = { git = "https://gitee.com/evorule/evorule.git", tag = "v0.8.5" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# 存证层哈希计算（wasm32 兼容；宪法断言测试共用）
blake3 = "1"

# wasm-bindgen only needed for the wasm32 entry; pure run_core has no async runtime.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"


# Native comparison program (same run_core logic, same inputs)
[[example]]
name = "native_demo"

# Day5 native performance benchmark
[[example]]
name = "bench_native"
